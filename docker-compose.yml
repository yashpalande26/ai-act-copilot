# This is a LOCAL/CI test database only - Postgres + pgvector for running
# integration tests without touching production data.
# The LIVE database is Supabase, configured via backend/.env DATABASE_URL.
# Never point application/production use at this compose file.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aiact
      POSTGRES_PASSWORD: aiact
      POSTGRES_DB: aiact
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiact -d aiact"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
